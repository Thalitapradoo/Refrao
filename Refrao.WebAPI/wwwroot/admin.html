<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel administrativo · Refrão!</title>
    <meta name="description" content="Refrão! — Plataforma de Catálogo de Músicas Pop.">
    <meta name="theme-color" content="#0f0a1a">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="topo"></header>
    <main class="container">
        <div class="cabecalho-pagina">
            <span class="sobretitulo">bastidores</span>
            <h1>Painel administrativo</h1>
        </div>
        <div class="estatisticas">
            <div class="estatistica painel"><div class="valor" id="totalMusicas">–</div><div class="rotulo">músicas</div></div>
            <div class="estatistica painel"><div class="valor" id="totalArtistas">–</div><div class="rotulo">artistas</div></div>
            <div class="estatistica painel"><div class="valor" id="totalAlbuns">–</div><div class="rotulo">álbuns</div></div>
            <div class="estatistica painel"><div class="valor" id="totalUsuarios">–</div><div class="rotulo">usuários</div></div>
        </div>
        <div class="abas-painel" role="tablist">
            <button type="button" class="ativo" data-aba="musicas">Músicas</button>
            <button type="button" data-aba="artistas">Artistas</button>
            <button type="button" data-aba="albuns">Álbuns</button>
            <button type="button" data-aba="generos">Gêneros</button>
            <button type="button" data-aba="usuarios">Usuários</button>
            <button type="button" data-aba="sugestoes">Sugestões<span class="contador-aba" id="contadorSugestoes" hidden></span></button>
        </div>
        <div class="aviso erro" id="erroPainel"></div>
        <section class="painel-conteudo painel" id="conteudoPainel"><div class="carregando"></div></section>
    </main>

    <dialog id="dialogo">
        <form id="formDialogo" novalidate>
            <h2 id="tituloDialogo"></h2>
            <div class="aviso erro" id="erroDialogo"></div>
            <div id="camposDialogo"></div>
            <div class="acoes-dialogo">
                <button type="button" class="botao secundario" id="cancelarDialogo">Cancelar</button>
                <button type="submit" class="botao">Salvar</button>
            </div>
        </form>
    </dialog>

    <dialog id="confirmacao">
        <form method="dialog" style="padding:1.6rem">
            <h3 id="textoConfirmacao" style="margin-bottom:1.2rem"></h3>
            <div class="acoes-dialogo">
                <button value="nao" class="botao secundario">Cancelar</button>
                <button value="sim" class="botao perigo" id="botaoConfirmar">Confirmar</button>
            </div>
        </form>
    </dialog>
    <footer id="rodape"></footer>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/validacao.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
