<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta · Refrão!</title>
    <meta name="description" content="Refrão! — Plataforma de Catálogo de Músicas Pop.">
    <meta name="theme-color" content="#0f0a1a">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="topo"></header>
    <main class="pagina-centro">
        <section class="cartao-form painel">
            <h1>Crie sua conta</h1>
            <p class="subtitulo">É grátis e leva menos de um minuto.</p>
            <div class="aviso" id="mensagem"></div>
            <form id="formCadastro" novalidate>
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" autocomplete="name" maxlength="100" required>
                    <div class="erro-campo"></div>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" autocomplete="email" maxlength="150" required>
                    <div class="erro-campo"></div>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" autocomplete="new-password" minlength="8" required>
                    <div class="ajuda">Mínimo de 8 caracteres.</div>
                    <div class="erro-campo"></div>
                </div>
                <div class="campo">
                    <label for="confirmacao">Confirmação de senha</label>
                    <input type="password" id="confirmacao" autocomplete="new-password" required>
                    <div class="erro-campo"></div>
                </div>
                <button class="botao" type="submit" style="width:100%">Criar conta</button>
            </form>
            <p class="rodape-form">Já tem conta? <a href="login.html">Entrar</a></p>
        </section>
    </main>
    <footer id="rodape"></footer>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/validacao.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
