<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo · Refrão!</title>
    <meta name="description" content="Refrão! — Plataforma de Catálogo de Músicas Pop.">
    <meta name="theme-color" content="#0f0a1a">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="topo"></header>
    <main class="container">
        <div class="cabecalho-pagina">
            <span class="sobretitulo">todas as faixas</span>
            <h1>Catálogo de músicas</h1>
        </div>
        <form class="filtros painel" id="formBusca" role="search">
            <div class="linha-busca">
                <label class="sr-only" for="busca">Pesquisar</label>
                <input type="search" id="busca" placeholder="Pesquise por título ou artista..." maxlength="150" autocomplete="off">
                <label class="sr-only" for="filtroArtista">Artista</label>
                <select id="filtroArtista"><option value="">Todos os artistas</option></select>
                <button class="botao" type="submit">Pesquisar</button>
            </div>
            <div class="chips" id="filtroGenero" aria-label="Filtrar por gênero"></div>
        </form>
        <div class="aviso erro" id="erroCatalogo"></div>
        <p class="resumo-lista" id="resumo"></p>
        <div class="grade-musicas" id="listaMusicas"><div class="carregando"></div></div>
        <nav class="paginacao" id="paginacao" aria-label="Paginação"></nav>
    </main>
    <footer id="rodape"></footer>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/catalogo.js"></script>
</body>
</html>
